<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Thokku Biryani">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#F97316" />
      <stop offset="1" stop-color="#EF4444" />
    </linearGradient>
    <style>
      .bg{fill:url(#g)}
      .bowl{fill:#fff}
      .rice{fill:#FDE68A}
      .text{font-family:Segoe UI, Roboto, Arial, sans-serif; font-weight:700; fill:#ffffff}
      .label{font-family:Segoe UI, Roboto, Arial, sans-serif; font-size:28px; fill:#111827}
      .desc{font-family:Segoe UI, Roboto, Arial, sans-serif; font-size:18px; fill:#374151}
    </style>
  </defs>
  <rect class="bg" width="1200" height="800" rx="24"/>
  <g transform="translate(120 80)">
    <rect x="0" y="0" width="960" height="640" rx="20" fill="#fff" />
    <g transform="translate(40 40)">
      <rect width="880" height="560" rx="16" fill="#FFF7ED" />
      <g transform="translate(40 36)">
        <ellipse cx="360" cy="200" rx="320" ry="140" class="bowl" />
        <path d="M40 200 C 120 50, 600 60, 720 200 L 720 260 C 600 420, 120 420, 40 260 Z" class="rice" />
        <g transform="translate(60 60)">
          <circle cx="40" cy="24" r="8" fill="#F97316" />
          <circle cx="80" cy="18" r="6" fill="#DC2626" />
          <circle cx="120" cy="30" r="6" fill="#F97316" />
          <rect x="0" y="90" width="440" height="8" rx="4" fill="#F3F4F6" />
        </g>
      </g>
      <g transform="translate(32 320)">
        <text x="0" y="28" class="label">Thokku Biryani</text>
        <text x="0" y="64" class="desc">Traditional spicy Thokku Biryani made with aromatic rice and signature masala.</text>
      </g>
    </g>
  </g>
</svg>